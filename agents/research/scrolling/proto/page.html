<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuna scrolling prototype</title>
<style>
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
#screen { height: 100dvh; }
#scroller { height: 100%; overflow: auto; overscroll-behavior: contain; position: relative;
            padding: 0 16px; font: 16px/24px system-ui, sans-serif; }
/* Nodes touch (padding, never margin), so the point at the top of the
   viewport always lands on a node or a spacer, never in a gap. */
.n { margin: 0; padding: 6px 0; }
.h { font-size: 22px; line-height: 32px; }
.pre { font: 14px/20px monospace; background: #f3f3f3; padding: 8px; white-space: pre-wrap;
       border-top: 4px solid #fff; border-bottom: 4px solid #fff; }
.box { box-sizing: border-box; border: 8px solid #fff; background: linear-gradient(#cde, #9bd); }
/* Spacers stand in for undrawn nodes. They must never be the browser's
   scroll anchor, or the browser would hold a spacer still instead of the
   text you are reading. The line pattern reads as "text coming". */
.spacer { overflow-anchor: none;
          background: repeating-linear-gradient(transparent 0 6px, #eceef2 6px 18px, transparent 18px 24px); }
#hud { position: fixed; right: 8px; top: 8px; font: 12px monospace; background: #ffffe0; padding: 4px;
       pointer-events: none; }
</style>
<script type="module" src="/datastar.js"></script>
</head>
<body data-signals="{y: 0, w: 0, h: 0}"
      data-init="@get('/screen?c={{C}}')"
      data-on:datastar-fetch__document="navigator.sendBeacon('/log?c={{C}}', 'fetch ' + evt.detail.type + ' ' + (evt.detail.el?.id || evt.detail.el?.tagName))"
      data-on:error__window="navigator.sendBeacon('/log?c={{C}}', 'js error ' + evt.message)"
      data-on:resize__window__debounce.100ms="$w = document.getElementById('scroller').clientWidth; $h = document.getElementById('scroller').clientHeight; @post('/resize?c={{C}}')">
{{SCREEN}}
<div id="hud" data-text="'scrollTop ' + Math.round($y) + ' · anchoring ' + (CSS.supports('overflow-anchor', 'auto') ? 'yes' : 'NO') + ' · ' + (navigator.userAgent.match(/OS (\d+)_(\d+)/)?.slice(1).join('.') ?? '')"></div>
<div data-init="$w = document.getElementById('scroller').clientWidth; $h = document.getElementById('scroller').clientHeight; @post('/resize?c={{C}}')"></div>
</body>
</html>
