<!doctype html>
<html lang="en" data-init="@get('/screen')">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Tuna scrolling prototype</title>
<style>
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
#screen { height: 100dvh; display: flex; flex-direction: column; }
.scroller { flex: 1; position: relative; overflow: auto; overscroll-behavior: contain;
            padding: 0 16px; font: 16px/24px system-ui, sans-serif; }
.scroller.owned { overflow: hidden; touch-action: none; }
.n { margin: 0; padding: 6px 0; }
h2.n { font-size: 22px; line-height: 32px; }
pre.n { font: 14px/20px monospace; background: #f3f3f3; padding: 8px; white-space: pre-wrap; }
.box { background: linear-gradient(#cde, #9bd); box-sizing: border-box; margin: 8px 0; }
#thumb { position: absolute; right: 2px; width: 6px; height: 40px; background: #888; border-radius: 3px; }
#hud { position: fixed; right: 8px; bottom: 8px; font: 12px monospace; background: #ffffe0; padding: 4px; }
</style>
<script type="importmap">{"imports":{"datastar":"/datastar.js"}}</script>
<script type="module" src="/datastar.js"></script>
<script type="module" src="/client.js"></script>
</head>
<body>{{SCREEN}}<div id="hud"></div></body>
</html>
